name: CI

# Runs on every push to main and on pull requests. Kept separate from the release
# workflow so a broken commit is caught here, minutes after it lands, instead of
# when a release tag is pushed. Never builds a release variant, so no keystore is
# required.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests & debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Tests and a debug build read these, and both have safe defaults, but
      # supplying them keeps the CI build identical to a developer's.
      - name: Setup Local Properties
        env:
          MODULE_INDEX_URL: ${{ secrets.MODULE_INDEX_URL }}
          PARTY_SERVER_URL: ${{ secrets.PARTY_SERVER_URL }}
        run: |
          echo "MODULE_INDEX_URL=${MODULE_INDEX_URL:-https://monochrome.rickyaddons.dpdns.org/8spine-source.json}" > local.properties
          # Listen Together's server. Written unconditionally, and blank counts
          # as absent on the Gradle side too — a CI run with no secret must not
          # produce a build that differs from a release in this one setting.
          echo "PARTY_SERVER_URL=${PARTY_SERVER_URL:-https://api.velthy.my.id}" >> local.properties
          echo "✅ Party server: ${PARTY_SERVER_URL:-https://api.velthy.my.id}"

      # A bigger heap than gradle.properties asks for, and only here.
      #
      # That file is tuned for a developer's machine, where several Gradle and
      # Kotlin daemons can end up alive at once and native memory is the thing
      # that runs out first — so it caps workers and keeps the heap modest. A
      # runner has one job and its own memory. The Kotlin backend on this
      # codebase (a 5,800-line player composable among it) genuinely needs more
      # than the local ceiling: it died with `OutOfMemoryError: Java heap space`
      # inside `compileProdReleaseKotlin`, on a commit that changed only a
      # workflow file.
      #
      # The keys are *replaced*, not appended: a duplicate would leave the
      # answer up to which occurrence Gradle happens to read, and this needs to
      # be certain. The checked-in values stay untouched for the local machine.
      - name: Raise build memory for CI
        run: |
          python3 - <<'EOF'
          import re

          path = "gradle.properties"
          with open(path, encoding="utf-8") as f:
              text = f.read()

          overrides = {
              "org.gradle.jvmargs":
                  "-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m "
                  "-Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true",
              "kotlin.daemon.jvmargs":
                  "-Xmx3g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=512m",
          }

          for key, value in overrides.items():
              pattern = re.compile(rf"^{re.escape(key)}=.*$", re.MULTILINE)
              if pattern.search(text):
                  text = pattern.sub(f"{key}={value}", text)
              else:
                  text = text.rstrip("\n") + f"\n{key}={value}\n"

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          for line in text.splitlines():
              if line.startswith(("org.gradle.jvmargs", "kotlin.daemon.jvmargs",
                                  "org.gradle.workers.max")):
                  print("  " + line)
          print("CI memory overrides applied")
          EOF

      # The dev variant only. A bare `test` walks every variant — including
      # `compileProdReleaseKotlin`, which is the same Kotlin backend work as the
      # release build, compiled a second time and thrown away. CI's job here is
      # to catch a broken commit, and the debug variant does that against the
      # same sources.
      - name: Run unit tests
        run: ./gradlew testDevDebugUnitTest --stacktrace

      - name: Compile debug build
        run: ./gradlew assembleDevDebug --stacktrace

      # Lint never gates the build (lint.abortOnError is false), but a report is
      # still produced for anyone who wants to look.
      - name: Run lint
        run: ./gradlew lintDevDebug --stacktrace
        continue-on-error: true

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
