name: Build & Release Velthy Android APK

on:
  push:
    tags:
      - 'v*'
      - 'native-v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version (e.g. 1.3.8). Kosongkan untuk Auto-Increment +1 dari rilis terakhir.'
        required: false
        default: ''
      release_notes:
        description: 'Catatan Rilis Kustom (Opsional)'
        required: false
        default: ''
      trigger_fcm:
        description: 'Kirim FCM Push Notification ke Pengguna'
        type: boolean
        required: false
        default: true

concurrency:
  group: build-velthy-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Velthy APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ── 1. CHECKOUT CODEBASE ──
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. SETUP JAVA 17 WITH GRADLE CACHING ──
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ── 3. GRANT EXECUTE PERMISSIONS ──
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 4. AUTO-DETERMINE & INCREMENT VERSION ──
      - name: Determine Version Tag
        id: get_version
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.version_tag }}" ]; then
            RAW_VER="${{ inputs.version_tag }}"
            RAW_VER="${RAW_VER#native-v}"
            RAW_VER="${RAW_VER#v}"
            TAG="v${RAW_VER}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ "${GITHUB_REF}" == refs/tags/native-v* ]]; then
            RAW_VER="${GITHUB_REF#refs/tags/native-v}"
            TAG="v${RAW_VER}"
          else
            # Fetch latest tag from releases (Synxx12/velthy first, fallback musique-app-releases)
            LATEST=$(gh release list --repo Synxx12/velthy --limit 30 2>/dev/null \
              | awk '{print $3}' | grep -E '^(native-v|v)' | head -n 1 || echo "")
            if [ -z "$LATEST" ]; then
              LATEST=$(gh release list --repo Synxx12/musique-app-releases --limit 30 2>/dev/null \
                | awk '{print $3}' | grep -E '^(native-v|v)' | head -n 1 || echo "")
            fi
            if [ -n "$LATEST" ]; then
              RAW="${LATEST#native-v}"
              RAW="${RAW#v}"
              PREFIX=$(echo "$RAW" | sed -E 's/^([0-9]+\.[0-9]+\.).*/\1/')
              PATCH=$(echo "$RAW" | sed -E 's/^[0-9]+\.[0-9]+\.([0-9]+).*/\1/')
              NEXT_PATCH=$((PATCH + 1))
              TAG="v${PREFIX}${NEXT_PATCH}"
              echo "💡 Auto-incremented from ${LATEST} -> ${TAG}"
            else
              TAG="v1.3.9"
            fi
          fi
          
          # Extract display version (without prefix)
          DISPLAY_VER="${TAG#native-v}"
          DISPLAY_VER="${DISPLAY_VER#v}"
          
          echo "VERSION_TAG=${TAG}" >> $GITHUB_ENV
          echo "DISPLAY_VERSION=${DISPLAY_VER}" >> $GITHUB_ENV
          echo "✅ Release Tag: ${TAG} (Display: v${DISPLAY_VER})"

      # ── 5. RESTORE RELEASE KEYSTORE & CONFIGURATION ──
      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > app/release.jks
            cat <<EOF > keystore.properties
          storeFile=release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
            echo "✅ Keystore restored from Secrets."
          else
            echo "⚠️ KEYSTORE_BASE64 secret not provided, auto-generating release keystore..."
            keytool -genkey -v -keystore app/release.jks -alias velthy -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass velthyreleasekey -keypass velthyreleasekey \
              -dname "CN=Velthy, OU=Release, O=VelthyApp, L=Jakarta, ST=Jakarta, C=ID"
            cat <<EOF > keystore.properties
          storeFile=release.jks
          storePassword=velthyreleasekey
          keyAlias=velthy
          keyPassword=velthyreleasekey
          EOF
            echo "✅ Release keystore generated successfully."
          fi

      - name: Setup Local Properties & Module Index
        env:
          MODULE_INDEX_URL: ${{ secrets.MODULE_INDEX_URL }}
        run: |
          MOD_URL="${MODULE_INDEX_URL:-https://monochrome.rickyaddons.dpdns.org/8spine-source.json}"
          echo "MODULE_INDEX_URL=${MOD_URL}" > local.properties
          echo "MODULE_INDEX_URL=${MOD_URL}" >> $GITHUB_ENV
          echo "✅ MODULE_INDEX_URL injected successfully: ${MOD_URL}"

      # ── 6. BUILD PRODUCTION APK RELEASE ──
      - name: Build Android APK
        env:
          MODULE_INDEX_URL: ${{ env.MODULE_INDEX_URL }}
        run: |
          ./gradlew assembleProdRelease --stacktrace
          
          mkdir -p release_assets
          
          ARM64=$(find app/build/outputs/apk/prod/release/ -name "*arm64-v8a*.apk" 2>/dev/null | head -n 1)
          ARMV7=$(find app/build/outputs/apk/prod/release/ -name "*armeabi-v7a*.apk" 2>/dev/null | head -n 1)
          X86_64=$(find app/build/outputs/apk/prod/release/ -name "*x86_64*.apk" 2>/dev/null | head -n 1)
          UNIVERSAL=$(find app/build/outputs/apk/prod/release/ -name "*universal*.apk" 2>/dev/null | head -n 1)
          
          # Primary APK: ARM64-v8a (or fallback to Universal)
          PRIMARY="${ARM64:-$UNIVERSAL}"
          
          if [ -z "$PRIMARY" ] || [ ! -f "$PRIMARY" ]; then
            PRIMARY=$(find app/build/outputs/apk/prod/release/ -name "*.apk" 2>/dev/null | head -n 1)
          fi
          
          if [ -f "$PRIMARY" ]; then
            # Standard lightweight assets (~27 MB)
            cp "$PRIMARY" "release_assets/Velthy-v${DISPLAY_VERSION}.apk"
            cp "$PRIMARY" "release_assets/Velthy-latest.apk"
            cp "$PRIMARY" "release_assets/Velthy-v${DISPLAY_VERSION}-arm64-v8a.apk"
            cp "$PRIMARY" "release_assets/Musique-v${DISPLAY_VERSION}-client.apk"
            cp "$PRIMARY" "release_assets/Musique-latest-client.apk"
            cp "$PRIMARY" "release_assets/Musique-v${DISPLAY_VERSION}.apk"
            
            # Universal and alternative architecture assets
            if [ -f "$UNIVERSAL" ]; then
              cp "$UNIVERSAL" "release_assets/Velthy-v${DISPLAY_VERSION}-universal.apk"
            fi
            if [ -f "$ARMV7" ]; then
              cp "$ARMV7" "release_assets/Velthy-v${DISPLAY_VERSION}-armeabi-v7a.apk"
            fi
            if [ -f "$X86_64" ]; then
              cp "$X86_64" "release_assets/Velthy-v${DISPLAY_VERSION}-x86_64.apk"
            fi
            
            echo "✅ Release APKs packaged successfully:"
            ls -lh release_assets/
          else
            echo "❌ APK Build Failed!"
            exit 1
          fi

      # ── 7. GENERATE RELEASE NOTES ──
      - name: Generate Release Notes
        env:
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          python3 - <<'EOF'
          import os, re, subprocess

          version_tag = os.environ.get('VERSION_TAG', 'v1.3.9')
          display_ver = os.environ.get('DISPLAY_VERSION', '1.3.9')
          custom_notes = os.environ.get('INPUT_RELEASE_NOTES', '').strip()
          version_file = f"docs/releases/{version_tag}.md"

          notes = ""

          # 1. Custom Notes from workflow_dispatch input
          if custom_notes:
              notes = f"## 🎵 Velthy v{display_ver}\n\n" + custom_notes
          # 2. Dedicated release file
          elif os.path.isfile(version_file):
              with open(version_file, "r", encoding="utf-8") as f:
                  notes = f.read().strip()
          # 3. Smart Extraction from docs/CHANGELOG.md
          elif os.path.isfile("docs/CHANGELOG.md"):
              with open("docs/CHANGELOG.md", "r", encoding="utf-8") as f:
                  content = f.read()
              
              # First try matching specific version tag (e.g. ### [v1.3.9] or ### [1.3.9])
              pattern_ver = r'###\s*\[(?:v)?' + re.escape(display_ver) + r'\][^\n]*\n(.*?)(?=\n---\s*\n\s*##|\n###\s*\[|\Z)'
              match_ver = re.search(pattern_ver, content, re.DOTALL)
              if match_ver and match_ver.group(1).strip():
                  extracted = match_ver.group(1).strip()
                  notes = f"## 🎵 Velthy v{display_ver}\n\n" + extracted
              else:
                  pattern_unreleased = r'###\s*\[Unreleased\][^\n]*\n(.*?)(?=\n---\s*\n\s*##|\n###\s*\[|\Z)'
                  match_unreleased = re.search(pattern_unreleased, content, re.DOTALL)
                  if match_unreleased and match_unreleased.group(1).strip():
                      extracted = match_unreleased.group(1).strip()
                      notes = f"## 🎵 Velthy v{display_ver}\n\n" + extracted

          # 4. Fallback: Recent git commits
          if not notes:
              try:
                  commits = subprocess.check_output(['git', 'log', '-n', '10', '--pretty=format:- %s'], stderr=subprocess.DEVNULL).decode('utf-8').strip()
              except Exception:
                  commits = "- Initial Velthy release"
              
              notes = f"## 🎵 Velthy v{display_ver}\n\n"
              notes += "Aplikasi pemutar musik **Velthy** 100% Client-Side / Serverless langsung di perangkat Android Anda.\n\n"
              notes += "### ✨ Fitur Unggulan:\n"
              notes += "- **Client-Side Innertube**: Streaming langsung ke YouTube Music tanpa server perantara\n"
              notes += "- **Ringan & Cepat (~27 MB)**: Optimalisasi ABI split untuk arsitektur 64-bit modern\n"
              notes += "- **Quick Picks di Home**: 4 baris lagu langsung di bagian atas untuk pemutaran instan 1-tap\n"
              notes += "- **Immersive Fullscreen Player**: Foto cover melebar edge-to-edge dengan vertical fade halus\n"
              notes += "- **Lirik Tersinkronisasi**: Lirik real-time LRCLIB ultra-smooth\n"
              notes += "- **Offline Downloads**: Menyimpan audio dengan metadata ID3/Vorbis langsung ke folder `Downloads/Velthy`\n"
              notes += "- **Opsi Background Lifecycle**: Pilihan menghentikan atau melanjutkan musik saat dihapus dari Recent Apps\n\n"
          def sanitize_for_public(text):
              # Strip internal markdown file links: [foo.kt](file:///...) -> foo
              text = re.sub(r'\[([^\]]+)\]\(file:///[^\)]+\)', r'\1', text)
              # Strip backticked source filenames like (`Foo.kt`), (`dev.ps1`), etc.
              text = re.sub(r'\s*\(`[^`]+\.(?:kt|ps1|xml|kts|java|json)`\)', '', text)
              # Strip developer-internal bullet points (like dev scripts, adb commands, pm clear)
              text = re.sub(r'-\s*\*\*Dev Runner[^\n]*\n(?:[ \t]+-[^\n]*\n)*', '', text)
              # Normalize multiple blank lines
              text = re.sub(r'\n{3,}', '\n\n', text)
              return text.strip()

          # Clean the extracted notes for consumer presentation
          notes = sanitize_for_public(notes)

          footer = f"\n---\n\n### 📱 Cara Instalasi\n1. Unduh file `Velthy-v{display_ver}.apk` (~27 MB) di bawah.\n2. Buka file APK di perangkat Android Anda.\n3. Izinkan **Install dari Sumber Tidak Dikenal** jika diminta.\n"

          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write(notes + footer)

          print(f"✅ Generated RELEASE_NOTES.md ({len(notes)} chars)")
          EOF

      # ── 8. CALCULATE SHA-256 CHECKSUM ──
      - name: Calculate Checksums
        run: |
          cd release_assets
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      # ── 9. PUBLISH TO SYNXX12/VELTHY REPOSITORY ──
      - name: Create GitHub Release in Synxx12/velthy
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "Velthy v${{ env.DISPLAY_VERSION }}"
          body_path: RELEASE_NOTES.md
          files: |
            release_assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
          overwrite_files: true

      # ── 10. MIRROR RELEASE TO SYNXX12/MUSIQUE-APP-RELEASES ──
      - name: Mirror Release to Synxx12/musique-app-releases
        if: always() && steps.create_release.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "Velthy v${{ env.DISPLAY_VERSION }}"
          body_path: RELEASE_NOTES.md
          files: |
            release_assets/*
          repository: "Synxx12/musique-app-releases"
          token: ${{ secrets.RELEASES_PAT || secrets.GITHUB_TOKEN }}
          overwrite_files: true
        continue-on-error: true

      # ── 11. TRIGGER FCM PUSH NOTIFICATION WEBHOOK ──
      - name: Trigger FCM Push Notification
        if: always() && (steps.create_release.outcome == 'success' || steps.create_release.outcome == 'skipped')
        run: |
          curl -s -A "Mozilla/5.0 GitHubActions/1.0" \
            -X POST "https://api.velthy.my.id/api/webhooks/github-release" \
            -H "x-api-key: ${{ secrets.INTERNAL_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"tagName\": \"${VERSION_TAG}\", \"edition\": \"client\", \"title\": \"Velthy v${DISPLAY_VERSION}\"}" || true
          echo "✅ FCM Notification Webhook Triggered."
